<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Dashboard</title>

    <link
      rel="stylesheet"
      href="./../vendors/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./../vendors/bootstrap-datetimepicker/bootstrap-datetimepicker.css"
    />
    <link rel="stylesheet" href="./../icons/style.css" />

    <link rel="stylesheet" href="../../css/styles.css" />

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body>
    <div class="lab-details-shimmer">
      <!-- Page Title Skeleton -->
      <div
        class="lab-details-shimmer__line lab-details-shimmer__line--page-title mb-4"
      ></div>

      <!-- Basic Info Card -->
      <div class="lab-details-shimmer__card card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <div
            class="lab-details-shimmer__line lab-details-shimmer__line--section-heading mb-4"
          ></div>

          <div class="row g-3">
            <div class="col-12 col-md-3">
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--value w-75"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--value w-85"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--value w-60"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--value w-100"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Lab Tests Package Main Panel -->
      <div class="lab-details-shimmer__card card border-0 shadow-sm">
        <div class="card-body p-4">
          <div
            class="lab-details-shimmer__line lab-details-shimmer__line--section-heading mb-4"
          ></div>

          <!-- Accordion Box -->
          <div class="lab-details-shimmer__accordion border rounded-3 p-3">
            <!-- Accordion Header -->
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--title"
              ></div>
              <div class="d-flex gap-2">
                <div
                  class="lab-details-shimmer__line lab-details-shimmer__line--icon"
                ></div>
                <div
                  class="lab-details-shimmer__line lab-details-shimmer__line--icon"
                ></div>
              </div>
            </div>

            <!-- Grey Inner Container -->
            <div class="lab-details-shimmer__inner-container rounded-3 p-3">
              <!-- Filter Tag Pill -->
              <div
                class="lab-details-shimmer__line lab-details-shimmer__line--badge mb-3"
              ></div>

              <!-- Top Pricing Info Cards (Blue & Green) -->
              <div class="row g-3 mb-3">
                <!-- All State Pricing Box -->
                <div class="col-12 col-md-6">
                  <div
                    class="lab-details-shimmer__info-box lab-details-shimmer__info-box--blue p-3 rounded-3 d-flex justify-content-between align-items-center"
                  >
                    <div class="lab-details-shimmer__info-content">
                      <div
                        class="lab-details-shimmer__line lab-details-shimmer__line--sub-heading mb-2"
                      ></div>
                      <div
                        class="lab-details-shimmer__line lab-details-shimmer__line--desc w-75"
                      ></div>
                    </div>
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--price ms-3"
                    ></div>
                  </div>
                </div>

                <!-- Selected State Pricing Box -->
                <div class="col-12 col-md-6">
                  <div
                    class="lab-details-shimmer__info-box lab-details-shimmer__info-box--green p-3 rounded-3 d-flex justify-content-between align-items-center"
                  >
                    <div class="lab-details-shimmer__info-content">
                      <div
                        class="lab-details-shimmer__line lab-details-shimmer__line--sub-heading mb-2"
                      ></div>
                      <div
                        class="lab-details-shimmer__line lab-details-shimmer__line--desc w-85"
                      ></div>
                    </div>
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--price ms-3"
                    ></div>
                  </div>
                </div>
              </div>

              <!-- Bottom Form Input Cards (Blue & Green) -->
              <div class="row g-3">
                <!-- All State Input Block -->
                <div class="col-12 col-md-6">
                  <div
                    class="lab-details-shimmer__input-box lab-details-shimmer__input-box--blue p-3 rounded-3"
                  >
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--sub-heading mb-1"
                    ></div>
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--desc w-65 mb-3"
                    ></div>

                    <!-- Alert Banner Pill -->
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--alert-pill mb-3"
                    ></div>

                    <!-- Input Label & Field -->
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--label mb-2"
                    ></div>
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--input"
                    ></div>
                  </div>
                </div>

                <!-- Selected State Input Block -->
                <div class="col-12 col-md-6">
                  <div
                    class="lab-details-shimmer__input-box lab-details-shimmer__input-box--green p-3 rounded-3"
                  >
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--sub-heading mb-1"
                    ></div>
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--desc w-65 mb-3"
                    ></div>

                    <!-- Alert Banner Pill -->
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--alert-pill mb-3"
                    ></div>

                    <!-- Input Label & Field -->
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--label mb-2"
                    ></div>
                    <div
                      class="lab-details-shimmer__line lab-details-shimmer__line--input"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="../js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../js/vendors/bootstrap.bundle.min.js"></script>
    <script src="./../vendors/swiper/package/swiper-bundle.min.js"></script>
    <script src="./../vendors/bootstrap-multiselect/js/bootstrap-multiselect.min.js"></script>
    <script src="./../vendors/trumbowyg/trumbowyg.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="./../vendors/moment/moment.js"></script>
    <script src="./../vendors/bootstrap-datetimepicker/bootstrap-datetimepicker.min.js"></script>
    <script src="./../js/datepicker.js"></script>
    <script src="./../js/date-range-picker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script src="./../js/main.js"></script>
  </body>
</html>
