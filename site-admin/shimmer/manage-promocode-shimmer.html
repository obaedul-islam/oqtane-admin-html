<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Dashboard</title>

    <link
      rel="stylesheet"
      href="./../vendors/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./../vendors/bootstrap-datetimepicker/bootstrap-datetimepicker.css"
    />
    <link rel="stylesheet" href="./../icons/style.css" />

    <link rel="stylesheet" href="../../css/styles.css" />

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body>
    <div class="manage-promocode-shimmer">
      <!-- Page Title Skeleton -->
      <div
        class="manage-promocode-shimmer__line manage-promocode-shimmer__line--title mb-4"
      ></div>

      <!-- Form Card Container -->
      <div class="manage-promocode-shimmer__card card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <div class="row g-4">
            <!-- Row 1: Select Code Type & Select Product -->
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>

            <!-- Row 2: Name & Select Discount Type -->
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>

            <!-- Row 3: Discount Amount & Select Status -->
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>

            <!-- Row 4: Active From & Active Till -->
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>

            <!-- Row 5: Select Referral -->
            <div class="col-12 col-md-6">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--label mb-2"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--input"
              ></div>
            </div>
          </div>

          <!-- Checkboxes Row -->
          <div
            class="manage-promocode-shimmer__checkboxes d-flex flex-wrap align-items-center gap-4 mt-4 pt-2"
          >
            <!-- Is Referral -->
            <div class="d-flex align-items-center gap-2">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--text w-60"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--checkbox"
              ></div>
            </div>
            <!-- Is Free Shipping -->
            <div class="d-flex align-items-center gap-2">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--text w-80"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--checkbox"
              ></div>
            </div>
            <!-- Is Free Consultancy Fee -->
            <div class="d-flex align-items-center gap-2">
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--text w-120"
              ></div>
              <div
                class="manage-promocode-shimmer__line manage-promocode-shimmer__line--checkbox"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Buttons -->
      <div
        class="manage-promocode-shimmer__actions d-flex justify-content-center gap-3 mt-4"
      >
        <div
          class="manage-promocode-shimmer__line manage-promocode-shimmer__line--btn"
        ></div>
        <div
          class="manage-promocode-shimmer__line manage-promocode-shimmer__line--btn"
        ></div>
      </div>
    </div>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="../js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../js/vendors/bootstrap.bundle.min.js"></script>
    <script src="./../vendors/swiper/package/swiper-bundle.min.js"></script>
    <script src="./../vendors/bootstrap-multiselect/js/bootstrap-multiselect.min.js"></script>
    <script src="./../vendors/trumbowyg/trumbowyg.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="./../vendors/moment/moment.js"></script>
    <script src="./../vendors/bootstrap-datetimepicker/bootstrap-datetimepicker.min.js"></script>
    <script src="./../js/datepicker.js"></script>
    <script src="./../js/date-range-picker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script src="./../js/main.js"></script>
  </body>
</html>
