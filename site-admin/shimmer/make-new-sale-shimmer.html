<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Dashboard</title>

    <link
      rel="stylesheet"
      href="./../vendors/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./../vendors/bootstrap-datetimepicker/bootstrap-datetimepicker.css"
    />
    <link rel="stylesheet" href="./../icons/style.css" />

    <link rel="stylesheet" href="../../css/styles.css" />

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body>
    <div class="make-new-sell-shimmer">
      <!-- Top Breadcrumb -->
      <div
        class="make-new-sell-shimmer__line make-new-sell-shimmer__line--breadcrumb"
      ></div>

      <!-- Stepper Indicator -->
      <div class="make-new-sell-shimmer__stepper">
        <div class="make-new-sell-shimmer__stepper-step">
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--circle"
          ></div>
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--step-label"
          ></div>
        </div>
        <div class="make-new-sell-shimmer__stepper-line"></div>
        <div class="make-new-sell-shimmer__stepper-step">
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--circle"
          ></div>
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--step-label"
          ></div>
        </div>
        <div class="make-new-sell-shimmer__stepper-line"></div>
        <div class="make-new-sell-shimmer__stepper-step">
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--circle"
          ></div>
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--step-label"
          ></div>
        </div>
        <div class="make-new-sell-shimmer__stepper-line"></div>
        <div class="make-new-sell-shimmer__stepper-step">
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--circle"
          ></div>
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--step-label"
          ></div>
        </div>
      </div>

      <!-- Selected Product Card -->
      <div class="make-new-sell-shimmer__card">
        <div class="make-new-sell-shimmer__card-header">
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--heading"
          ></div>
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--search"
          ></div>
        </div>

        <div class="make-new-sell-shimmer__product-item">
          <!-- Left Thumbnail & Details -->
          <div class="make-new-sell-shimmer__product-info">
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--thumbnail"
            ></div>
            <div class="make-new-sell-shimmer__product-details">
              <div
                class="make-new-sell-shimmer__line make-new-sell-shimmer__line--title"
              ></div>
              <div
                class="make-new-sell-shimmer__line make-new-sell-shimmer__line--price"
              ></div>
              <div class="make-new-sell-shimmer__checkbox-wrapper">
                <div
                  class="make-new-sell-shimmer__line make-new-sell-shimmer__line--checkbox"
                ></div>
                <div
                  class="make-new-sell-shimmer__line make-new-sell-shimmer__line--checkbox-text"
                ></div>
              </div>
            </div>
          </div>

          <!-- Right Controls: Quantity & Delete -->
          <div class="make-new-sell-shimmer__product-controls">
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--qty-box"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--icon"
            ></div>
          </div>
        </div>
      </div>

      <!-- Order Total & Discounts Card -->
      <div class="make-new-sell-shimmer__card">
        <div
          class="make-new-sell-shimmer__line make-new-sell-shimmer__line--heading"
        ></div>

        <!-- Radio Controls -->
        <div class="make-new-sell-shimmer__radio-group">
          <div class="make-new-sell-shimmer__radio-item">
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--radio"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--radio-label"
            ></div>
          </div>
          <div class="make-new-sell-shimmer__radio-item">
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--radio"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--radio-label"
            ></div>
          </div>
        </div>

        <!-- Promo Input Field -->
        <div class="make-new-sell-shimmer__field-group">
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--label"
          ></div>
          <div
            class="make-new-sell-shimmer__line make-new-sell-shimmer__line--input"
          ></div>
        </div>

        <!-- Order Summary Table -->
        <div class="make-new-sell-shimmer__table">
          <!-- Header -->
          <div
            class="make-new-sell-shimmer__table-row make-new-sell-shimmer__table-row--header"
          >
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text make-new-sell-shimmer__line--text-right"
            ></div>
          </div>
          <!-- Row 1: Product -->
          <div class="make-new-sell-shimmer__table-row">
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text make-new-sell-shimmer__line--text-right"
            ></div>
          </div>
          <!-- Row 2: Shipping -->
          <div class="make-new-sell-shimmer__table-row">
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text make-new-sell-shimmer__line--text-right"
            ></div>
          </div>
          <!-- Row 3: Total -->
          <div
            class="make-new-sell-shimmer__table-row make-new-sell-shimmer__table-row--total"
          >
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text"
            ></div>
            <div
              class="make-new-sell-shimmer__line make-new-sell-shimmer__line--text make-new-sell-shimmer__line--text-right"
            ></div>
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <div class="make-new-sell-shimmer__actions">
        <div
          class="make-new-sell-shimmer__line make-new-sell-shimmer__line--btn"
        ></div>
      </div>
    </div>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="../js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../js/vendors/bootstrap.bundle.min.js"></script>
    <script src="./../vendors/swiper/package/swiper-bundle.min.js"></script>
    <script src="./../vendors/bootstrap-multiselect/js/bootstrap-multiselect.min.js"></script>
    <script src="./../vendors/trumbowyg/trumbowyg.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="./../vendors/moment/moment.js"></script>
    <script src="./../vendors/bootstrap-datetimepicker/bootstrap-datetimepicker.min.js"></script>
    <script src="./../js/datepicker.js"></script>
    <script src="./../js/date-range-picker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script src="./../js/main.js"></script>
  </body>
</html>
