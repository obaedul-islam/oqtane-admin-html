<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Dashboard</title>

    <link
      rel="stylesheet"
      href="./../vendors/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./../vendors/bootstrap-datetimepicker/bootstrap-datetimepicker.css"
    />
    <link rel="stylesheet" href="./../icons/style.css" />

    <link rel="stylesheet" href="../../css/styles.css" />

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body>
    <div class="order-details-shimmer">
      <!-- Breadcrumb Skeleton -->
      <div
        class="order-details-shimmer__line order-details-shimmer__line--breadcrumb mb-3"
      ></div>

      <!-- Order ID Title Skeleton -->
      <div
        class="order-details-shimmer__line order-details-shimmer__line--title mb-4"
      ></div>

      <!-- Shipping Information Card -->
      <div class="order-details-shimmer__card card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <div
            class="order-details-shimmer__line order-details-shimmer__line--section-heading mb-4"
          ></div>

          <!-- Top Grid: Name, Address, State, City -->
          <div class="row g-3 mb-5">
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-75"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-85"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-50"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-50"
              ></div>
            </div>
          </div>

          <!-- Bottom Grid: Zip code, Email Address -->
          <div class="row g-5">
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-40"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-100"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Billing Information Card -->
      <div class="order-details-shimmer__card card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <div
            class="order-details-shimmer__line order-details-shimmer__line--section-heading mb-4"
          ></div>

          <!-- Top Grid: Name, Address, State, City -->
          <div class="row g-3 mb-5">
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-75"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-85"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-50"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-50"
              ></div>
            </div>
          </div>

          <!-- Bottom Grid: Zip code, Email Address -->
          <div class="row g-3">
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-40"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-100"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Customer Details Card (Green Highlight Card) -->
      <div
        class="order-details-shimmer__card order-details-shimmer__card--highlight card border-0 shadow-sm"
      >
        <div class="card-body p-4">
          <div
            class="order-details-shimmer__line order-details-shimmer__line--section-heading mb-4"
          ></div>

          <!-- Single Row Grid: Name, Gender, Cell Number, Email -->
          <div class="row g-3">
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-75"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-50"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-75"
              ></div>
            </div>
            <div class="col-12 col-md-3">
              <div
                class="order-details-shimmer__line order-details-shimmer__line--label mb-2"
              ></div>
              <div
                class="order-details-shimmer__line order-details-shimmer__line--value w-100"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="../js/vendors/jquery-3.7.1.min.js"></script>
    <script src="../js/vendors/bootstrap.bundle.min.js"></script>
    <script src="./../vendors/swiper/package/swiper-bundle.min.js"></script>
    <script src="./../vendors/bootstrap-multiselect/js/bootstrap-multiselect.min.js"></script>
    <script src="./../vendors/trumbowyg/trumbowyg.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="./../vendors/moment/moment.js"></script>
    <script src="./../vendors/bootstrap-datetimepicker/bootstrap-datetimepicker.min.js"></script>
    <script src="./../js/datepicker.js"></script>
    <script src="./../js/date-range-picker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script src="./../js/main.js"></script>
  </body>
</html>
